services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: guardrail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: guardrail
      POSTGRES_PASSWORD: guardrail
      POSTGRES_DB: guardrail
    ports:
      - "5432:5432"
    volumes:
      - guardrail-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardrail -d guardrail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  guardrail-postgres-data:
